  <script>
    /* Ajuste automático da altura do iframe.
       A agenda (Tech VET) envia {type:'techvet:height', height:<px>} via postMessage.
       Enquanto isso não chega, vale a altura fixa definida no CSS. */
    (function () {
      var ORIGEM = 'https://vetplatform-alf9ll8o.manus.space';
      var frame = document.querySelector('.agenda-vet-frame');
      if (!frame) return;
      window.addEventListener('message', function (e) {
        if (e.origin !== ORIGEM || e.source !== frame.contentWindow) return;
        var d = e.data;
        if (!d || d.type !== 'techvet:height') return;
        var h = Number(d.height);
        if (!isFinite(h) || h <= 0) return;
        /* protege contra valores absurdos: mínimo 300px, máximo 10.000px */
        h = Math.min(Math.max(Math.ceil(h), 300), 10000);
        frame.style.height = h + 'px';
      });
    })();
