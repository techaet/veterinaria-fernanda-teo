name: Artigo para revisão

# Rascunho enviado para um branch artigo/<slug> → abre uma issue e avisa no Telegram.
on:
  push:
    branches: ['artigo/**']

permissions:
  contents: read
  issues: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pedir revisão
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          PREVIA: https://raw.githack.com/${{ github.repository }}/${{ github.sha }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          # Leonardo recebe os artigos pela fila de aprovações do bot Carrosseis AET (rotina-carrossel, 25/10/2026)
          TELEGRAM_FILA_ID: ${{ secrets.TELEGRAM_FILA_ID }}
        run: |
          slug="${BRANCH#artigo/}"
          f="blog/$slug/index.html"
          campo() { python3 -c "import re,html,sys;print(html.unescape(re.search(sys.argv[2],open(sys.argv[1],encoding='utf-8').read()).group(1)))" "$f" "$1"; }
          titulo=$(campo 'property="og:title" content="([^"]+)"')
          descricao=$(campo 'property="og:description" content="([^"]+)"')
          idioma=$(campo '<html lang="([^"]+)"')
          link="$PREVIA/blog/$slug/index.html"
          # Pontos de atenção clínica: corpo da mensagem do último commit do rascunho
          notas=$(git log -1 --format=%b | grep -v '^Co-Authored-By' || true)

          gh label create artigo --color d77d55 --description "Artigo aguardando revisão" --force
          aberta=$(gh issue list --label artigo --state open --json number,body -q ".[] | select(.body | contains(\"$BRANCH\")) | .number" | head -1)
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body "Rascunho atualizado. Nova prévia: $link"
            exit 0
          fi

          cat > corpo.md <<EOF
          Novo artigo para revisão ($idioma).

          ### $titulo
          $descricao

          👉 **Ver como vai ficar no site:** $link

          **Pontos para conferir com a Dra. Fernanda:**
          $notas

          **Decisão pelo Telegram (botões na mensagem do bot) ou comentando aqui:**
          - **PUBLICAR**: vai ao ar em cerca de 1 minuto
          - **EXCLUIR**: descarta o rascunho

          Rascunho: \`$BRANCH\`
          EOF
          url=$(gh issue create --title "Revisar artigo: $titulo" --label artigo --body-file corpo.md)
          num="${url##*/}"

          # Aviso no Telegram com botões (opcional: só se os secrets existirem)
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_IDS" ]; then
            texto=$(printf 'Novo artigo para revisão\n\n%s\n\nPrévia: %s\n\nPontos para conferir:\n%s' "$titulo" "$link" "$notas")
            for chat in ${TELEGRAM_CHAT_IDS//,/ }; do
              [ "$chat" = "$TELEGRAM_FILA_ID" ] && continue
              curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
                --data-urlencode "chat_id=$chat" --data-urlencode "text=$texto" \
                --data-urlencode "reply_markup={\"inline_keyboard\":[[{\"text\":\"✅ Publicar\",\"callback_data\":\"publicar:$num\"},{\"text\":\"🗑️ Excluir\",\"callback_data\":\"excluir:$num\"}]]}" || true
            done
          fi
