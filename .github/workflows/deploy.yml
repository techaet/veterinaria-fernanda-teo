name: Deploy para o cPanel (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Verificar o site (sitemap, feed, conformidade, imagens)
        run: python3 scripts/verificar.py

      - name: Testar o painel (/painel/)
        run: php scripts/test_painel.php

      - name: Gerar o índice de busca (Pagefind) — vai para /pagefind/ no servidor
        run: npx --yes pagefind@1.5.2 --site . --glob "blog/*/index.html"

      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            ATUALIZACAO_VISUAL_VETERINARIA_20260826.md
            LEIA-ME-BLOG-VETERINARIA.txt
            LEIA-ME_ATUALIZACAO.md
            CLAUDE.md
            regras-compliance.md
            **/.claude/**
            **/scripts/**
            **/incorporacao-agenda-vet/**
            **/.DS_Store

      - name: Avisar o painel (último deploy)
        if: success()
        continue-on-error: true  # sem o secret PAINEL_TOKEN o painel só não mostra o "Último deploy"; o site já foi
        env:
          MENSAGEM: ${{ github.event.head_commit.message }}
        run: |
          python3 -c 'import json,os;print(json.dumps({"commit":os.environ["GITHUB_SHA"][:7],"mensagem":(os.environ.get("MENSAGEM") or "").split("\n")[0]}))' > "$RUNNER_TEMP/deploy.json"
          curl -fsS -X POST -H "X-Painel-Key: ${{ secrets.PAINEL_TOKEN }}" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/deploy.json" "https://www.fernandateo.vet.br/painel/api.php?acao=deploy"
