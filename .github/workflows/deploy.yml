name: Deploy (rsync para a VPS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Verificar o site (sitemap, feed, conformidade, imagens)
        run: python3 scripts/verificar.py

      - name: Testar o painel (/painel/)
        run: php scripts/test_painel.php

      - name: Gerar o índice de busca (Pagefind) — vai para /pagefind/ no servidor
        run: npx --yes pagefind@1.5.2 --site . --glob "blog/*/index.html"

      - name: Enviar o site por rsync para a VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # sem --delete e sem tocar em painel/_dados (dados do painel, só no servidor)
          rsync -rlptz --chmod=D755,F644 --exclude '.git*' --exclude '.github' --exclude 'README.md' --exclude 'ATUALIZACAO_VISUAL_VETERINARIA_20260826.md' --exclude 'LEIA-ME-BLOG-VETERINARIA.txt' --exclude 'LEIA-ME_ATUALIZACAO.md' --exclude 'CLAUDE.md' --exclude 'regras-compliance.md' --exclude '.claude' --exclude 'scripts' --exclude 'incorporacao-agenda-vet' --exclude '.DS_Store' --exclude 'painel/_dados' -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" ./ deploy@189.24.7.25:./

      - name: Avisar o painel (último deploy)
        if: success()
        continue-on-error: true  # sem o secret PAINEL_TOKEN o painel só não mostra o "Último deploy"; o site já foi
        env:
          MENSAGEM: ${{ github.event.head_commit.message }}
        run: |
          python3 -c 'import json,os;print(json.dumps({"commit":os.environ["GITHUB_SHA"][:7],"mensagem":(os.environ.get("MENSAGEM") or "").split("\n")[0]}))' > "$RUNNER_TEMP/deploy.json"
          curl -fsS -X POST -H "X-Painel-Key: ${{ secrets.PAINEL_TOKEN }}" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/deploy.json" "https://www.fernandateo.vet.br/painel/api.php?acao=deploy"
